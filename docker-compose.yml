services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citavek
    ports:
      - "5436:5432"
    volumes:
      - citavek_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d citavek"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citavek_pgdata:
